# SchoolMove — configuratiebestand
# ─────────────────────────────────────────────────────────────────────────────
# Dit is het enige bestand dat je aanpast om de pipeline bij te sturen.
# De R-scripts lezen deze waarden in bij het opstarten — je hoeft geen
# .R-bestanden te openen.
#
# Paden zijn relatief aan de r/ werkdirectory (één niveau binnen de repo).
# ─────────────────────────────────────────────────────────────────────────────

# ── Datapaden ─────────────────────────────────────────────────────────────────
paths:
  data_raw:       "../data/raw"           # Invoermap voor echte data. Bevat submappen meting_1/ en meting_2/.
                                          # Mag ook een absoluut pad zijn, bv. "C:/Data/SchoolMove".
  data_processed: "../data/processed"     # Uitvoermap voor GGIR-resultaten en samenvattingsbestanden.
  data_example:   "../data/example"       # Fictieve testdata — veilig om te committen.
  absences:       "../data/absences.csv"  # Afwezigheidsregister, beheerd via het dashboard.

# ── GGIR-parameters ───────────────────────────────────────────────────────────
ggir:
  parts: [1, 2, 3, 4, 5]        # informatief, niet actief ingelezen
  overwrite: false               # true = verwerk al verwerkte bestanden opnieuw; gelezen door: 01_run_ggir.R
  epoch_length_s: 1              # informatief, niet actief ingelezen (CSV's zijn reeds per seconde geaggregeerd)

  # Activiteitsgrenswaarden (ENMO in mg) — polshorloge bij kinderen, Hildebrand et al. 2014
  # Gelezen door: 01_run_ggir.R (threshold.lig / threshold.mod / threshold.vig)
  cut_points_mg:
    sedentary_to_light:    56.3   # SB  | LPA
    light_to_moderate:    191.6   # LPA | MPA
    moderate_to_vigorous: 695.8   # MPA | VPA

  # Non-wear detectie
  nonwear_window_min: 15         # informatief, niet actief ingelezen (GGIR gebruikt interne standaard)

  # Aantal CPU-kernen dat GGIR mag gebruiken.
  # 1 = één kern (veilig op elke laptop). Op een moderne laptop zijn 2–4 kernen sneller.
  maxNcores: 1

  # qwindow-strategie:
  #   "manual" — gebruik de qwindow-lijst hieronder (standaard, aanbevolen).
  #   "auto"   — leidt grenspunten automatisch af uit de schoolroosters.
  #              Let op: wisselen naar "auto" vereist een volledige herrun van stap 01 (GGIR).
  qwindow_strategy: "manual"

  # Tijdsgrenzen voor dagdelen (decimale uren, 24-uursformaat).
  # Geldig als qwindow_strategy = "manual". Past bij de roosters van alle scholen.
  # Pas alleen aan als je de grenzen wil verfijnen — een herrun van stap 01 is dan nodig.
  qwindow: [0, 8.5, 10.0, 12.0, 13.0, 15.5, 24]

# ── Boutdetectie ──────────────────────────────────────────────────────────────
# Gebruikt door utils_bouts.R wanneer epoch-niveau data beschikbaar is.
# split_at_context_boundary: een sedentaire bout wordt afgebroken als de
# schoolcontext verandert (bv. een 35 min. zitperiode over een speeltijd heen
# telt als twee aparte bouts).
bouts:
  sedentary_min: 30              # minimum aaneengesloten minuten voor een sedentaire bout
  light_min: 10                  # informatief, nog niet actief ingelezen
  moderate_min: 5                # informatief, nog niet actief ingelezen
  vigorous_min: 5                # informatief, nog niet actief ingelezen
  split_at_context_boundary: true  # nog niet actief — wacht op methodologische beslissing

# ── Geldigheidsdrempels ───────────────────────────────────────────────────────
validity:
  # Criteria voor sedentaire analyse
  min_wear_hours_per_day: 9    # minimum draaguren per dag om een dag als geldig te tellen
  min_valid_days: 4             # minimum aantal geldige dagen per meting
  require_weekend_day: true     # minimaal één weekenddag vereist onder de geldige dagen
  # Criteria voor slaapanalyse
  min_valid_nights_sleep: 5    # minimum nachten met geldige slaap voor de slaapanalyse
  min_pct_night_valid: 50      # minimum slaapefficiëntie (%) om een nacht als geldig te tellen

# ── Meetperiodes ──────────────────────────────────────────────────────────────
# Indicatieve data-inzameling per school en meting.
# Bron: Info_metingen.docx
# Informatief — wordt niet actief ingelezen door de pipeline.
measurements:
  school_1:
    n_pupils: 70
    meting_1: { start: "2026-02-23", end: "2026-03-02" }
    meting_2: { start: "2026-06-01", end: "2026-06-08" }
  school_2:
    n_pupils: 80
    meting_1: { start: "2026-03-03", end: "2026-03-10" }
    meting_2: { start: "2026-05-26", end: "2026-06-02" }
  school_3:
    n_pupils: 60
    meting_1: { start: "2026-01-19", end: "2026-01-26" }
    meting_2: { start: "2026-04-20", end: "2026-04-27" }
  school_4:
    n_pupils: 65
    meting_1: { start: "2026-02-05", end: "2026-02-12" }
    meting_2: { start: "2026-05-21", end: "2026-05-28" }
  school_5:
    n_pupils: 55
    meting_1: { start: "2026-01-09", end: "2026-01-16" }
    meting_2: { start: "2026-03-11", end: "2026-03-18" }
  school_6:
    n_pupils: 70
    meting_1: { start: "2026-03-02", end: "2026-03-09" }
    meting_2: { start: "2026-05-04", end: "2026-05-11" }

# ── Schoolroosters ────────────────────────────────────────────────────────────
# Bepaalt het contextlabel per epoch: in_class, recess, lunch,
# before_school, after_school of weekend.
#
# Tijden in HH:MM, 24-uursformaat, tijdzone Europe/Brussels.
# fallback: true = rooster is een benadering; fallback: false = bevestigd rooster.
schedules:

  school_1:
    fallback: false
    school_start: "08:25"
    school_end:
      mon_thu_fri: "15:40"
      tuesday:     "16:30"
      wednesday:   "11:55"
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "10:05", end: "10:20" }
        - { label: lunch,  start: "12:00", end: "13:00" }
        - { label: recess, start: "14:40", end: "14:50" }
      wednesday:
        - { label: recess, start: "10:05", end: "10:15" }

  school_2:
    fallback: false
    school_start: "08:25"
    school_end:
      mon_tue_thu_fri: "15:35"
      wednesday:       "12:00"
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "10:05", end: "10:20" }
        - { label: lunch,  start: "12:00", end: "12:50" }
        - { label: recess, start: "14:30", end: "14:45" }
      wednesday:
        - { label: recess, start: "10:05", end: "10:20" }

  school_3:
    fallback: false
    school_start: "08:25"
    school_end:
      mon_tue_thu_fri: "15:35"
      wednesday:       "12:00"
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "10:05", end: "10:20" }
        - { label: lunch,  start: "12:00", end: "12:50" }
        - { label: recess, start: "14:30", end: "14:45" }
      wednesday:
        - { label: recess, start: "10:05", end: "10:20" }
    # Per-klasoverride: 2e-jaars leerlingen hebben een 8e lesuur (→ 16:25) op bepaalde dagen.
    # Bron: e-mail Veerle Van Oeckel + Info_metingen.docx
    class_overrides:
      2Aa:
        pupils: [3025, 3026, 3027]
        school_end_override: { monday: "16:25", thursday: "16:25" }
      2Ab:
        pupils: [3024, 3028, 3029, 3030, 3032, 3034, 3041, 3042]
        school_end_override: { thursday: "16:25" }
      2Ba:
        pupils: [3040]
        school_end_override: { tuesday: "16:25", thursday: "16:25" }
      2Bb:
        pupils: [3031]
        school_end_override: { thursday: "16:25" }

  school_4:
    # Bron: roosterafbeelding (Secundair en OKAN). Woensdageinde geschat (les 4 → 12:15).
    fallback: false
    school_start: "08:40"
    school_end:
      mon_tue_thu_fri: "16:35"
      wednesday:       "12:15"
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "10:20", end: "10:35" }
        - { label: lunch,  start: "12:15", end: "13:15" }
      wednesday:
        - { label: recess, start: "10:20", end: "10:35" }

  school_5:
    fallback: false
    school_start: "08:30"
    school_end:
      mon_tue_thu_fri: "15:55"
      wednesday:       "12:05"    # geschat einde na het 4e lesuur
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "10:10", end: "10:25" }
        - { label: lunch,  start: "12:05", end: "13:10" }
        - { label: recess, start: "14:50", end: "15:05" }
      wednesday: []               # geen namidag

  school_6:
    fallback: false
    school_start: "08:30"
    school_end:
      mon_tue_thu_fri: "15:25"
      wednesday:       "12:00"
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "11:00", end: "11:15" }
        - { label: lunch,  start: "12:55", end: "13:45" }
      wednesday:
        - { label: recess, start: "10:10", end: "10:20" }

# ── Ontwikkelaars- en testinstellingen ───────────────────────────────────────
dev:
  # true = gebruik de fictieve testdata in data/example/ (snel, enkele minuten).
  # false = gebruik de echte data in de map aangeduid door paths > data_raw.
  example_mode: false

  # Snelle test met echte data: verwerk alleen de eerste N deelnemers per meting.
  # Handig om te controleren of de pipeline de bestanden correct inleest zonder uren te wachten.
  # Zet op ~ (of verwijder de waarde) om alle deelnemers te verwerken.
  # Voorbeeld: quick_test_n: 2
  quick_test_n: ~

  # Algoritme voor non-wear detectie (GGIR-parameter).
  # "2013" is vereist voor 1 Hz CSV-bestanden (GENEActiv-export). Niet aanpassen.
  nonwear_approach: "2013"

  # Verlaagde drempel voor "geldige dag" — ALLEEN actief als example_mode: true.
  # De fictieve testdata in data/example/ haalt de echte 16 u/dag drempel niet,
  # waardoor een demo met dummy-data altijd "0% geldig" toont. Deze override
  # heeft geen enkel effect op echte data (example_mode: false negeert dit).
  includedaycrit: 4

# ── Reproduceerbaarheid ───────────────────────────────────────────────────────
# Deze acties worden altijd uitgevoerd door run_all.R — de vlaggen hieronder
# zijn informatief en worden niet actief ingelezen.
reproducibility:
  save_ggir_config:      true   # kopieert GGIR config.csv naar logs/ na stap 01
  write_input_manifest:  true   # schrijft logs/input_manifest.csv bij aanvang pipeline
  write_run_log:         true   # voegt een regel toe aan logs/pipeline_runs.csv na afloop

# ── Configuratieprofielen ─────────────────────────────────────────────────────
# Profielen laten je benoemde parametersets opslaan (geldigheidsdrempels,
# grenswaarden, boutduren) zonder dit bestand rechtstreeks te bewerken.
# Het actieve profiel wordt geladen door de Shiny-app bij het opstarten.
# Profielen worden beheerd via tabblad "Instellingen" in het dashboard.
profiles:
  active:    "default"
  directory: "profiles/"    # relatief aan de r/ werkdirectory

# ── Uitvoerinstellingen ───────────────────────────────────────────────────────
output:
  timezone: "Europe/Brussels"   # tijdzone voor alle datumberekeningen; gelezen door: 01_run_ggir.R, shiny/global.R
  locale:   "nl_BE"             # informatief, niet actief ingelezen
