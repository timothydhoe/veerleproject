# SchoolMove Pipeline Configuration
# ─────────────────────────────────────────────────────────────────────────────
# This is the single file researchers should edit to adjust pipeline behaviour.
# R scripts read these values at startup — you should not need to edit any
# .R files to change parameters.
#
# Paths are relative to the r/ working directory (one level inside the repo).
# ─────────────────────────────────────────────────────────────────────────────

# ── Data paths ────────────────────────────────────────────────────────────────
paths:
  # ⚠ CHANGED for test data — restore to "../data/raw" before real data runs
  data_raw:       "../data/raw/veerle_testdata"  # Test data (.bin + .cwa)
  data_processed: "../data/veerle_processed/r"    # ⚠ TEST: separate output folder
  data_example:   "../data/example"              # Fictional test data (safe to commit)

# ── GGIR parameters ───────────────────────────────────────────────────────────
ggir:
  parts: [1, 2, 3, 4, 5]        # documentation only — script hardcodes mode=1:5
  overwrite: false              # Set to true to force re-processing of existing output
  epoch_length_s: 1             # documentation only — not passed to GGIR (CSVs are pre-epoched)

  # Activity cut-points (ENMO in mg) — wrist-worn GENEActiv, Hildebrand et al. 2014
  cut_points_mg:
    sedentary_to_light:    56.3   # SB  | LPA boundary
    light_to_moderate:    191.6   # LPA | MPA boundary
    moderate_to_vigorous: 695.8   # MPA | VPA boundary

  # Non-wear detection
  nonwear_window_min: 15        # documentation only — not passed to GGIR (uses GGIR defaults)

  # Parallel processing: number of CPU cores GGIR may use.
  # 1 = single-core (safe for laptops). Set to 4–8 on a server or workstation.
  maxNcores: 1

  # qwindow strategy:
  #   "manual" — use the qwindow list below (current behaviour, safe default).
  #   "auto"   — derive breakpoints from all schools' bell times in schedules:
  #              produces a finer-grained qwindow that aligns exactly with each
  #              school's schedule. IMPORTANT: switching to "auto" requires
  #              re-running Step 01 (GGIR) — this takes hours on a full dataset.
  qwindow_strategy: "manual"

  # Time-of-day segment boundaries (decimal hours, 24-h clock).
  # Used when qwindow_strategy is "manual". GGIR Part 2 produces separate
  # activity columns for each window, e.g. dur_day_total_IN_min_8.5.10.
  # 02_label_segments.R maps these windows onto school-specific context labels.
  # Values are a compromise across all school schedules; adjust if needed.
  #   08:30 – schools start (08:25–08:30)
  #   10:00 – just before first recess (10:05–10:15 across schools)
  #   12:00 – lunch start
  #   13:00 – approx. end of lunch (ranges 12:50–13:30)
  #   15:30 – covers most end-of-day times (15:25–15:55; school 4 ends 16:30)
  qwindow: [0, 8.5, 10.0, 12.0, 13.0, 15.5, 24]

# ── Bout detection parameters ─────────────────────────────────────────────────
# Used by utils_bouts.R when epoch-level data is available.
# split_at_context_boundary: true means a sedentary bout is reset when the
# school context changes (e.g. a 35-min sit that spans a recess is counted
# as two separate bouts, not one).
bouts:
  sedentary_min: 30              # minimum consecutive minutes to count as a SB bout
  light_min: 10                  # documentation only — not yet used by pipeline
  moderate_min: 5                # documentation only — not yet used by pipeline
  vigorous_min: 5                # documentation only — not yet used by pipeline
  split_at_context_boundary: true  # not yet active — pending methodological decision

# ── Validity criteria ─────────────────────────────────────────────────────────
validity:
  # Sedentary analysis criteria
  # ⚠ RELAXED for 24h test data — restore before real data runs:
  #   min_wear_hours_per_day: 16, min_valid_days: 3, require_weekend_day: true,
  #   min_valid_nights_sleep: 5
  min_wear_hours_per_day: 10
  min_valid_days: 1
  require_weekend_day: false
  # Sleep analysis criteria
  min_valid_nights_sleep: 1    # min nights with valid sleep to include in sleep analysis
  min_pct_night_valid: 50      # min sleep efficiency % to count a night as valid

# ── Measurement windows ───────────────────────────────────────────────────────
