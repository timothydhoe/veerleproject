# ── School schedules ──────────────────────────────────────────────────────────
# Used to assign a context label to every epoch: in_class, recess, lunch,
# before_school, after_school, or weekend.
#
# Times are HH:MM in 24-hour format, Europe/Brussels timezone.
# Schools marked  fallback: true  use an approximate schedule and update when
# the confirmed timetable is received from Veerle.
schedules:

  school_1:
    fallback: false
    school_start: "08:25"
    school_end:
      mon_thu_fri: "15:40"
      tuesday:     "16:30"
      wednesday:   "11:55"
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "10:05", end: "10:20" }
        - { label: lunch,  start: "12:00", end: "13:00" }
        - { label: recess, start: "14:40", end: "14:50" }
      wednesday:
        - { label: recess, start: "10:05", end: "10:15" }

  school_2:
    fallback: false
    school_start: "08:25"
    school_end:
      mon_tue_thu_fri: "15:35"
      wednesday:       "12:00"
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "10:05", end: "10:20" }
        - { label: lunch,  start: "12:00", end: "12:50" }
        - { label: recess, start: "14:30", end: "14:45" }
      wednesday:
        - { label: recess, start: "10:05", end: "10:20" }

  school_3:
    # ⚠ FALLBACK — detailed timetable not yet available. Update when received.
    fallback: true
    school_start: "08:30"
    school_end:
      mon_tue_thu_fri: "15:30"
      wednesday:       "12:00"
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "10:15", end: "10:30" }
        - { label: lunch,  start: "12:00", end: "13:00" }
      wednesday:
        - { label: recess, start: "10:15", end: "10:30" }

  school_4:
    # ⚠ FALLBACK — timetable was image-only and could not be fully parsed. Update when received.
    fallback: true
    school_start: "08:30"
    school_end:
      mon_tue_thu_fri: "16:30"
      wednesday:       "12:00"
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "10:15", end: "10:30" }
        - { label: lunch,  start: "12:00", end: "13:30" }
      wednesday:
        - { label: recess, start: "10:15", end: "10:30" }

  school_5:
    fallback: false
    school_start: "08:30"
    school_end:
      mon_tue_thu_fri: "15:55"
      wednesday:       "12:05"    # Assumed end after 4th period
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "10:10", end: "10:25" }
        - { label: lunch,  start: "12:05", end: "13:10" }
        - { label: recess, start: "14:50", end: "15:05" }
      wednesday: []               # No afternoon

  school_6:
    fallback: false
    school_start: "08:30"
    school_end:
      mon_tue_thu_fri: "15:25"
      wednesday:       "12:00"
    breaks:
      mon_tue_thu_fri:
        - { label: recess, start: "11:00", end: "11:15" }
        - { label: lunch,  start: "12:55", end: "13:45" }
      wednesday:
        - { label: recess, start: "10:10", end: "10:20" }

# ── Developer / testing ───────────────────────────────────────────────────────
dev:
  # Set to true to run the pipeline on example/dummy data instead of data/raw/.
  # Flip to false when processing real participant data.
  example_mode: false

  # GGIR non-wear algorithm override.
  # For raw .bin/.cwa data (100 Hz) the 2023 algorithm is preferred.
  # For 1 Hz dummy CSV data, use "2013" (2023 collapses variance at 1 Hz).
  # ⚠ Set to "2013" when running on dummy CSV data.
  nonwear_approach: "2023"

  # Relaxed GGIR validity thresholds for 24h test data.
  # ⚠ Reset to null (or remove) before running on real participant data.
  includedaycrit: 10         # GGIR Part 2: min valid hours per day (production = 16)
  includedaycrit_part5: 0.3  # GGIR Part 5: min fraction of waking day (production = 0.667)

# ── Reproducibility tracking ──────────────────────────────────────────────────
# These actions always run unconditionally in run_all.R — the flags below are
# documentation only and are not checked at runtime.
reproducibility:
  save_ggir_config:      true   # copy GGIR config.csv to logs/ after Step 01
  write_input_manifest:  true   # write logs/input_manifest.csv at pipeline start
  write_run_log:         true   # append to logs/pipeline_runs.csv at pipeline end

# ── Configuration profiles ────────────────────────────────────────────────────
# Profiles let Veerle save and restore named parameter sets (validity thresholds,
# cut-points, bout durations) without editing this file directly.
# The active profile is loaded by the Shiny app at startup and merged over the
# base values in this file.
# Profiles are managed through Tab 7 "Instellingen" in the Shiny dashboard.
profiles:
  active:    "default"
  directory: "profiles/"    # relative to r/ working directory

# ── Output settings ───────────────────────────────────────────────────────────
output:
  timezone: "Europe/Brussels"   # read by: 01_run_ggir.R (desiredtz), shiny/global.R
  locale:   "nl_BE"             # documentation only — not applied by any script
