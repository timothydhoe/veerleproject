    meting_2: { start: "2026-05-26", end: "2026-06-02" }
  school_3:
    n_pupils: 60
    meting_1: { start: "2026-01-19", end: "2026-01-26" }
    meting_2: { start: "2026-04-20", end: "2026-04-27" }
  school_4:
    n_pupils: 65
    meting_1: { start: "2026-02-05", end: "2026-02-12" }
    meting_2: { start: "2026-05-21", end: "2026-05-28" }
  school_5:
