# SchoolMove — Configuration Profile
# ─────────────────────────────────────────────────────────────────────────────
# This profile captures a named, saved parameter preset. It only takes effect
# once deliberately activated (config.yaml's profiles.active: "default") via
# Tab 7 "Instellingen" > "Activeer" — while active, it is merged over the base
# values in config.yaml and the pipeline uses the merged values when running.
# With profiles.active: "none" (the project's default), this file is inert
# and config.yaml's own values govern directly.
#
# To create a new profile: open Tab 7, adjust parameters, click "Opslaan als".
# To activate a profile for the pipeline: click "Activeer" in Tab 7.
# To go back to using config.yaml directly: select "Geen (config.yaml)" in
# Tab 7 and click "Activeer".
# ─────────────────────────────────────────────────────────────────────────────

profile_name: "Standaard"
created_at:   "2026-04-14"
notes:        "Standaard parameters — identiek aan de waarden in config.yaml."

# Geldigheidsparameters (Validity)
validity:
  min_wear_hours_per_day:  16
  min_valid_days:           3
  require_weekend_day:   true
  min_valid_nights_sleep:   5
  min_pct_night_valid:     50

# Activiteitsdrempels (Cut-points, ENMO in mg)
# Hildebrand et al. 2014/2017, pols, kinderen
ggir:
  cut_points_mg:
    sedentary_to_light:    56.3
    light_to_moderate:    191.6
    moderate_to_vigorous: 695.8

# Bouten (Bouts)
bouts:
  sedentary_min:               30
  light_min:                   10
  moderate_min:                 5
  vigorous_min:                 5
  split_at_context_boundary: true
