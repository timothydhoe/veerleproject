# =============================================================================
# SchoolMoves Pipeline — Configuration Parameters
# =============================================================================
# Edit these values to tune the pipeline. All modules read from this file.
# Do NOT hardcode parameters in R or Python scripts.
# =============================================================================

# === Input/Output ===
input_dir: "../data/raw/veerle_testdata/meting_1/"  # ⚠ TEST: Veerle's test data
output_dir: "../data/veerle_processed/project_1/"  # ⚠ TEST: separate output folder
log_dir: "logs/"                 # Conversion and pipeline logs

# === ENMO cut-points (mg) — Hildebrand et al. wrist, children ===
# These thresholds classify each 1-second epoch into an intensity level.
# sedentary:  ENMO < threshold_lig
# light:      threshold_lig <= ENMO < threshold_mod
# moderate:   threshold_mod <= ENMO < threshold_vig
# vigorous:   ENMO >= threshold_vig
threshold_lig: 56.3              # Below this = sedentary behaviour
threshold_mod: 191.6             # Below this = light physical activity
threshold_vig: 695.8             # Below this = moderate; above = vigorous

# === GGIR settings ===
epoch_lengths: [5, 900, 3600]    # 5-second, 15-minute, 1-hour windows (GGIR default)
do_calibration: true             # Auto-calibration via sphere-fitting
sensor_location: "wrist"         # Device placement (wrist for GENEActiv)
acc_metric: "ENMO"               # Acceleration metric (Euclidean Norm Minus One)
desiredtz: "Europe/Brussels"     # Timezone for all timestamp operations

# GGIR Parts to run (1-5)
ggir_mode: [1, 2, 3, 4, 5]      # Parts 1-5; Part 5 = time-use analysis

# Sleep detection (GGIR Part 3/4)
sleep_algorithm: "HDCZA"         # HDCZA = Heuristic algorithm for sleep detection

# GGIR Part 5 — time-use analysis
save_ms5rawlevels: true          # Save epoch-level Part 5 output
save_ms5raw_without_invalid: false
part5_agg2_60seconds: true       # 60-second aggregated Part 5 time series

# qwindow — day-segment boundaries for GGIR Part 2/5
# "auto" = derive from school_schedules.yaml
# or specify manually as decimal hours: [0, 8.5, 12, 15.5, 24]
qwindow_strategy: "auto"

# Bout detection (GGIR Part 5)
boutdur_mvpa: [1, 5, 10]         # MVPA bout durations to report (minutes)
boutdur_in: [10, 20, 30]         # Inactivity bout durations to report (minutes)
boutdur_lig: [1, 5, 10]          # Light activity bout durations to report (minutes)

# Reports to generate
do_report: [2, 4, 5]             # Generate reports for Parts 2, 4, 5

# === Validity criteria ===
# A pupil must meet BOTH waking and sleep criteria to be included in analysis.
# Waking analysis: minimum valid days with sufficient wear time.
# Sleep analysis: minimum valid nights with sufficient data coverage.
# ⚠ RELAXED for 24h test data — restore before real data runs:
#   min_valid_days_waking: 4, min_valid_hours_per_day: 9, min_valid_nights_sleep: 5
min_valid_days_waking: 1         # Minimum number of valid waking days
min_valid_hours_per_day: 6       # Minimum waking wear hours per valid day
min_valid_nights_sleep: 1        # Minimum number of valid nights for sleep analysis
min_pct_night_valid: 50          # Percentage of night with valid data required

# === Bout detection (per intensity level) ===
# Minimum consecutive minutes at a given intensity to count as a "bout".
# Bouts spanning context boundaries (e.g. class -> recess) are split.
bout_min_minutes:
  sedentary: 30                  # 30+ min sustained sedentary = prolonged sitting
  light: 10                      # 10+ min sustained light activity
  moderate: 5                    # 5+ min sustained moderate activity
  vigorous: 5                    # 5+ min sustained vigorous activity

# === Metadata ===
# Optional SPSS .sav files for richer metadata (absences, observation periods, etc.)
# Set to null or omit if not available — config.yaml schedules will be used instead
sav_metadata_dir: null             # Path to directory with .sav admin files

# === Output ===
output_format: "csv"             # "parquet" or "csv" — format for processed epoch data
