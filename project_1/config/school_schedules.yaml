# =============================================================================
# SchoolMoves — School Schedules
# =============================================================================
# Time windows for each school. Used by label_school_context() to tag each
# epoch with a context: in_class, recess, lunch, before_school, after_school.
#
# schedule_source:
#   "confirmed" = timetable verified with the school
#   "fallback"  = generic Belgian primary school schedule (Schools 3 & 4)
#
# Weekends are detected automatically by day-of-week (no entry needed).
# Times that fall outside all defined blocks default to context = "unknown".
# =============================================================================

schools:
  - school_id: 1
    schedule_source: "confirmed"
    school_start: "08:30"
    school_end: "15:30"
