name: Build Windows bundle

# Produces the portable SchoolMove bundle: R + a pre-restored renv library +
# the repo, zipped up. Double-click "2 - Dashboard starten.bat" with no install
# step and no network access required.
# Manually triggered.

on:
  workflow_dispatch:
  push:
    tags:
      - "bundle-*"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R and restore renv library
        uses: ./.github/actions/setup-r-env

      - name: Assemble bundle
        shell: pwsh
        run: |
          pwsh scripts/bundle/build-bundle.ps1 `
            -RepoRoot "${{ github.workspace }}" `
            -OutputDir "${{ runner.temp }}/SchoolMove"

      - name: Zip bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ runner.temp }}/SchoolMove" `
            -DestinationPath "${{ runner.temp }}/SchoolMove_Windows.zip" -Force
          $sizeMB = [math]::Round((Get-Item "${{ runner.temp }}/SchoolMove_Windows.zip").Length / 1MB, 1)
          Write-Host "Bundle zip size: $sizeMB MB"

      # extract the zip and launch it via the bundled R (not the CI runner's ambient R)
      - name: Extract and smoke test the bundle
        shell: pwsh
        run: |
          $extractDir = "${{ runner.temp }}/bundle_verify"
          Expand-Archive -Path "${{ runner.temp }}/SchoolMove_Windows.zip" -DestinationPath $extractDir
          $bundleRoot = Join-Path $extractDir "SchoolMove"
          $rscript = Join-Path $bundleRoot "R-portable\bin\x64\Rscript.exe"
          if (-not (Test-Path $rscript)) { $rscript = Join-Path $bundleRoot "R-portable\bin\Rscript.exe" }

          pwsh scripts/ci/smoke_test_shiny.ps1 `
            -RDir (Join-Path $bundleRoot "r") `
            -RscriptPath $rscript

      # Exercise the real .bat launcher end-to-end through cmd.exe, the way
      # Veerle will actually invoke it. The smoke test above only drives R
      # directly and would miss bugs in the .bat file's own logic (quoting,
      # errorlevel handling, pause behaviour).
      - name: Run the bundled pipeline .bat end-to-end
        shell: pwsh
        run: |
          $bundleRoot = Join-Path "${{ runner.temp }}/bundle_verify" "SchoolMove"

          # Point the extracted bundle's config.yaml at the dummy example
          # data so the run completes in CI time — same trick as
          # scripts/ci/run_example_pipeline.R, but driven through the real
          # .bat file this time instead of `source()`. This edits the
          # throwaway copy of config.yaml inside the extracted bundle, not
          # the repo's.
          $cfgPath = Join-Path $bundleRoot "config.yaml"
          (Get-Content $cfgPath -Raw) `
            -replace 'example_mode: false', 'example_mode: true' `
            -replace 'quick_test_n: ~', 'quick_test_n: 2' |
            Set-Content -Path $cfgPath -NoNewline

          $batPath = Join-Path $bundleRoot "1 - Pipeline uitvoeren.bat"
          if (-not (Test-Path $batPath)) {
            throw "Pipeline .bat not found at: $batPath"
          }

          # Invoke via System.Diagnostics.Process with ArgumentList (a real
          # array) instead of `cmd /c "`"$batPath`" < nul"` (a hand-built,
          # manually-quoted string). That string form failed twice in CI with
          # the exact same symptom — the .bat exiting in ~3s with zero
          # output, even after the .bat's own logic was independently fixed
          # and verified correct by manual inspection — which points to
          # PowerShell's own argument tokenization mis-parsing a string that
          # mixes embedded quotes with a space-containing path before cmd.exe
          # ever saw a well-formed command line (this project hit the same
          # class of quoting bug once before, in the Shiny smoke test).
          # ArgumentList lets .NET build the command line the way
          # CreateProcess expects, with no manual quoting at all. Closing
          # StandardInput immediately (EOF) has the same effect as the
          # original "< nul" — the .bat's `pause` prompts return immediately
          # instead of hanging the runner waiting for a keypress. stdout/
          # stderr are captured and printed explicitly so a future failure
          # shows the .bat's own output instead of just an exit code.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName               = "cmd.exe"
          $psi.ArgumentList.Add("/c")
          $psi.ArgumentList.Add($batPath)
          $psi.WorkingDirectory       = $bundleRoot
          $psi.RedirectStandardInput  = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError  = $true
          $psi.UseShellExecute        = $false

          $proc = [System.Diagnostics.Process]::Start($psi)
          $proc.StandardInput.Close()
          # Read both streams asynchronously *before* WaitForExit() — reading
          # them sequentially (stdout fully, then stderr) can deadlock if the
          # child fills the OS pipe buffer on one stream while we're blocked
          # reading the other, and GGIR alone produces plenty of console
          # output even for the quick dummy-data test this step runs.
          $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
          $stderrTask = $proc.StandardError.ReadToEndAsync()
          $proc.WaitForExit()
          $stdout = $stdoutTask.Result
          $stderr = $stderrTask.Result

          Write-Host "--- .bat stdout ---"
          Write-Host $stdout
          if ($stderr) {
            Write-Host "--- .bat stderr ---"
            Write-Host $stderr
          }

          if ($proc.ExitCode -ne 0) {
            throw "Pipeline .bat exited with code $($proc.ExitCode)"
          }
          Write-Host "OK: pipeline .bat completed successfully against dummy example data"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolMove_Windows_bundle
          path: ${{ runner.temp }}/SchoolMove_Windows.zip
          retention-days: 30
