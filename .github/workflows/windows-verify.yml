name: Windows verify

# Proves — on a real, clean Windows machine — that install,
# the pipeline, and the Shiny dashboard all actually work.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    # Free windows-latest runners vary in speed run-to-run; the GGIR pipeline
    # step alone has taken anywhere from ~42 to 53+ minutes on 2 dummy
    # participants across observed runs. 60 min was too tight and got a run
    # cancelled outright (not failed — GitHub kills the job at the timeout).
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R and restore renv library
        uses: ./.github/actions/setup-r-env

      - name: Run pipeline in example mode (dummy data, quick test)
        working-directory: r
        run: Rscript ../scripts/ci/run_example_pipeline.R

      - name: Smoke test Shiny dashboard
        shell: pwsh
        run: |
          pwsh scripts/ci/smoke_test_shiny.ps1 -RDir "${{ github.workspace }}/r"
